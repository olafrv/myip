services:
  myip:
    container_name: myip
    image: olafrv/myip:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION}
        PNPM_VERSION: ${PNPM_VERSION}
    environment:
      # MYIP_DB_REFRESH_ONLY must be 1 => true, 0 => false
      - MYIP_DB_REFRESH_ONLY=${MYIP_DB_REFRESH_ONLY:-0}
      - NODE_ENV=production
    env_file:
      - .env
    ports:
      - "${MYIP_PORT}:${MYIP_PORT}"
    restart: always
    volumes:
      - ./dbs:/usr/src/app/dbs
      - "${MYIP_SSL_KEY:-./tmp/localhost-pk.pem}:/usr/src/app/letsencrypt/privkey.pem"
      - "${MYIP_SSL_FULLCHAIN:-./tmp/localhost-fc.pem}:/usr/src/app/letsencrypt/fullchain.pem"
